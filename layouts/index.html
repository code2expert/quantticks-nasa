<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantticks Oracle | Global Wildfire Telemetry Command Center</title>
    <!-- Include Globe.gl (Three.js powered 3D Earth) & Plotly for side BI charts -->
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(17, 24, 39, 0.85);
            --card-hover: rgba(22, 31, 51, 0.95);
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(31, 41, 55, 0.8);
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* Full-Viewport Globe Canvas Container */
        #globe-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
        }

        /* Floating HUD Top Header & Filter Bar */
        .hud-header {
            position: absolute; top: 20px; left: 24px; right: 24px; z-index: 20;
            display: flex; flex-direction: column; gap: 12px; pointer-events: none;
        }
        .hud-header > * { pointer-events: auto; }

        header {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 14px 24px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .brand-group { display: flex; flex-direction: column; }
        .brand { font-size: 1.25rem; font-weight: 800; color: var(--text-main); letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
        .brand span { color: var(--accent-green); }
        .subtitle { font-size: 0.75rem; color: var(--text-muted); }
        .status-badge {
            background: rgba(16, 185, 129, 0.12); color: var(--accent-green); padding: 6px 14px;
            border-radius: 9999px; font-size: 0.775rem; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.35);
            display: inline-flex; align-items: center; gap: 8px;
        }
        .pulse-dot { width: 7px; height: 7px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }

        .filter-bar {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .filter-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
        select { background-color: #090d16; color: var(--text-main); border: 1px solid #374151; border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; outline: none; cursor: pointer; }
        select:focus { border-color: var(--accent-green); }
        input[type="range"] { accent-color: var(--accent-green); cursor: pointer; width: 90px; }
        .conf-readout { font-size: 0.8rem; font-weight: 700; color: var(--accent-green); min-width: 32px; }
        .btn-export {
            background-color: var(--accent-green); color: #06281e; border: none; border-radius: 6px;
            padding: 7px 14px; font-size: 0.775rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-export:hover { opacity: 0.92; transform: translateY(-1px); }

        /* Floating Right-Hand BI Drawer */
        .bi-drawer {
            position: absolute; top: 140px; right: 24px; bottom: 24px; width: 440px; z-index: 15;
            background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 14px;
            padding: 20px; display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease; overflow-y: auto;
        }
        .bi-drawer.collapsed { transform: translateX(470px); }
        
        .drawer-toggle {
            position: absolute; left: -42px; top: 24px; width: 42px; height: 42px;
            background: var(--card-bg); border: 1px solid var(--border-color); border-right: none;
            border-top-left-radius: 8px; border-bottom-left-radius: 8px;
            color: var(--text-main); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(12px); box-shadow: -5px 0 15px rgba(0,0,0,0.3);
        }
        .drawer-toggle:hover { color: var(--accent-green); }

        .grid-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { background: rgba(25, 33, 50, 0.6); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; }
        .card-title { font-size: 0.65rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .metric-value { font-size: 1.25rem; font-weight: 800; color: var(--text-main); line-height: 1.1; }
        .metric-sub { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }

        .chart-box { background: rgba(25, 33, 50, 0.4); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .bi-drawer { width: 100%; right: 0; bottom: 0; top: auto; max-height: 50vh; border-radius: 14px 14px 0 0; }
            .drawer-toggle { display: none; }
        }
    </style>
</head>
<body>

    <!-- Full-Viewport 3D Earth Globe -->
    <div id="globe-container"></div>

    <!-- HUD Header & Controls -->
    <div class="hud-header">
        <header>
            <div class="brand-group">
                <div class="brand">QUANTTICKS ORACLE <span>// GLOBAL TELEMETRY</span></div>
                <div class="subtitle">Multi-Satellite Thermal Anomaly Harmonization &amp; Fire Radiative Power Monitoring</div>
            </div>
            <div class="status-badge"><span class="pulse-dot"></span> Powered by Quantticks</div>
        </header>

        <div class="filter-bar">
            <div class="filter-controls">
                <div class="control-group">
                    <label for="aoi-select">Region:</label>
                    <select id="aoi-select">
                        <option value="ALL">All Global Regions</option>
                        {{ range .Site.Data.active_fires.active_aois }}
                        <option value="{{ .region }}">{{ .region }}</option>
                        {{ end }}
                    </select>
                </div>
                <div class="control-group">
                    <label for="sensor-select">Sensor:</label>
                    <select id="sensor-select">
                        <option value="ALL">MODIS + VIIRS</option>
                        <option value="MODIS">MODIS Only</option>
                        <option value="VIIRS">VIIRS Only</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="conf-slider">Min Conf:</label>
                    <input type="range" id="conf-slider" min="0" max="100" step="5" value="50">
                    <span class="conf-readout" id="conf-value">50%</span>
                </div>
            </div>
            <button class="btn-export" id="export-csv-btn">&#8681; Export CSV</button>
        </div>
    </div>

    <!-- Right-Hand Floating BI Drawer -->
    <div class="bi-drawer" id="bi-drawer">
        <button class="drawer-toggle" id="drawer-toggle-btn" title="Toggle Analytics Panel">&#9664;</button>
        
        <!-- Metrics Summary Grid -->
        <div class="grid-metrics">
            <div class="card">
                <div class="card-title">Events Audited</div>
                <div class="metric-value" id="metric-events">0</div>
                <div class="metric-sub" id="metric-events-sub">R2 Window</div>
            </div>
            <div class="card">
                <div class="card-title">Compression</div>
                <div class="metric-value" style="color: var(--accent-green);">~80.5%</div>
                <div class="metric-sub">ZSTD Parquet</div>
            </div>
            <div class="card">
                <div class="card-title">Sensors</div>
                <div class="metric-value" style="color: var(--accent-purple);" style="font-size: 1rem;">MODIS/VIIRS</div>
                <div class="metric-sub">Harmonized</div>
            </div>
        </div>

        <!-- Regional Volume Chart -->
        <div class="chart-box">
            <div id="regional-volume" style="width:100%; height:240px;"></div>
        </div>

        <!-- Sensor Breakdown Chart -->
        <div class="chart-box">
            <div id="sensor-breakdown" style="width:100%; height:220px;"></div>
        </div>
    </div>

<script>
    // Deduplicate Target Region dropdown options on load
    const aoiSelect = document.getElementById('aoi-select');
    const seenRegions = new Set();
    Array.from(aoiSelect.options).forEach(opt => {
        if (opt.value !== 'ALL') {
            if (seenRegions.has(opt.value)) opt.remove();
            else seenRegions.add(opt.value);
        }
    });

    const telemetryDataset = [
        {{ range .Site.Data.active_fires.summary_metrics }}
        { region: "{{ .region }}", sensor: "{{ .sensor_type }}", detections: {{ .total_detections }}, avgConfidence: {{ .avg_confidence }}, maxFrp: {{ .max_frp }}, earliest: "{{ .earliest_source_time }}", latest: "{{ .latest_source_time }}" },
        {{ end }}
    ];

    const hotspotDataset = [
        {{ range .Site.Data.active_fires.hotspots }}
        { lat: {{ .lat }}, lon: {{ .lon }}, frp: {{ .frp }}, confidence: {{ .confidence }}, sensor: "{{ .sensor_type }}", region: "{{ .region }}" },
        {{ end }}
    ];

    const darkLayout = {
        paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
        font: { family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif', color: '#f3f4f6', size: 11 },
        margin: { t: 30, r: 15, b: 30, l: 35 }
    };

    // Initialize Globe.gl 3D Earth
    const globe = Globe()
        (document.getElementById('globe-container'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .pointLat(d => d.lat)
        .pointLng(d => d.lon)
        .pointColor(d => d.frp > 100 ? '#ef4444' : d.frp > 50 ? '#f59e0b' : '#10b981')
        .pointAltitude(d => Math.min(0.2, d.frp * 0.001))
        .pointRadius(d => Math.max(0.4, Math.min(1.2, Math.sqrt(d.frp) * 0.15)))
        .pointLabel(d => `<div style="background:rgba(11,17,26,0.9); padding:8px 12px; border-radius:6px; border:1px solid #374151; font-size:12px;">
            <strong>${d.region}</strong><br/>
            Sensor: ${d.sensor}<br/>
            FRP: <strong>${d.frp} MW</strong><br/>
            Confidence: ${d.confidence}%
        </div>`);

    // Set initial camera point
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.5;

    const sensorSelect = document.getElementById('sensor-select');
    const confSlider = document.getElementById('conf-slider');
    const confValue = document.getElementById('conf-value');
    const metricEvents = document.getElementById('metric-events');
    const metricEventsSub = document.getElementById('metric-events-sub');
    const exportCsvBtn = document.getElementById('export-csv-btn');
    const biDrawer = document.getElementById('bi-drawer');
    const drawerToggleBtn = document.getElementById('drawer-toggle-btn');

    // Toggle Sidebar Drawer
    let drawerOpen = true;
    drawerToggleBtn.addEventListener('click', () => {
        drawerOpen = !drawerOpen;
        biDrawer.classList.toggle('collapsed', !drawerOpen);
        drawerToggleBtn.innerHTML = drawerOpen ? '&#9654;' : '&#9664;';
    });

    function renderDashboard() {
        const selectedRegion = aoiSelect.value;
        const selectedSensorMode = sensorSelect.value;
        const minConf = parseFloat(confSlider.value);
        confValue.textContent = `${minConf}%`;

        const filteredSummary = telemetryDataset.filter(row => {
            const regionMatch = (selectedRegion === 'ALL' || row.region === selectedRegion);
            const confMatch = row.avgConfidence >= minConf;
            let sensorMatch = true;
            if (selectedSensorMode === 'MODIS') sensorMatch = row.sensor.toUpperCase().includes('MODIS');
            else if (selectedSensorMode === 'VIIRS') sensorMatch = row.sensor.toUpperCase().includes('VIIRS');
            return regionMatch && confMatch && sensorMatch;
        });

        const filteredHotspots = hotspotDataset.filter(pt => {
            const regionMatch = (selectedRegion === 'ALL' || pt.region === selectedRegion);
            const confMatch = pt.confidence >= minConf;
            let sensorMatch = true;
            if (selectedSensorMode === 'MODIS') sensorMatch = pt.sensor.toUpperCase().includes('MODIS');
            else if (selectedSensorMode === 'VIIRS') sensorMatch = pt.sensor.toUpperCase().includes('VIIRS');
            return regionMatch && confMatch && sensorMatch;
        });

        let grandTotal = 0;
        let sensorCounts = {};
        filteredSummary.forEach(item => {
            grandTotal += item.detections;
            sensorCounts[item.sensor] = (sensorCounts[item.sensor] || 0) + item.detections;
        });

        metricEvents.textContent = grandTotal.toLocaleString();
        metricEventsSub.textContent = selectedRegion === 'ALL' ? `Across ${filteredSummary.length} streams` : `${selectedRegion}`;

        // Update 3D Globe Hotspots
        globe.pointsData(filteredHotspots);

        // Fly camera to region if selected
        if (selectedRegion !== 'ALL' && filteredHotspots.length > 0) {
            globe.controls().autoRotate = false;
            const avgLat = filteredHotspots.reduce((s, p) => s + p.lat, 0) / filteredHotspots.length;
            const avgLon = filteredHotspots.reduce((s, p) => s + p.lon, 0) / filteredHotspots.length;
            globe.pointOfView({ lat: avgLat, lng: avgLon, altitude: 1.5 }, 1200);
        } else {
            globe.controls().autoRotate = true;
            globe.pointOfView({ lat: 20, lng: 0, altitude: 2.5 }, 1200);
        }

        // Side BI Chart 1: Regional Volume
        Plotly.react('regional-volume', [{
            type: 'bar', orientation: 'h',
            x: filteredSummary.map(d => d.detections),
            y: filteredSummary.map(d => `${d.region}`),
            marker: { color: '#10b981' }
        }], {
            ...darkLayout,
            title: { text: 'Volume by Region', font: { size: 13 } },
            xaxis: { gridcolor: '#1f2937' },
            yaxis: { tickfont: { size: 9 } }
        }, { responsive: true, displayModeBar: false });

        // Side BI Chart 2: Sensor Breakdown
        const sensors = Object.keys(sensorCounts);
        const sensorValues = Object.values(sensorCounts);
        Plotly.react('sensor-breakdown', [{
            x: sensors.length > 0 ? sensors : ['No Data'],
            y: sensorValues.length > 0 ? sensorValues : [0],
            type: 'bar', marker: { color: ['#8b5cf6', '#3b82f6', '#10b981'] }
        }], {
            ...darkLayout,
            title: { text: 'Detections by Sensor', font: { size: 13 } },
            xaxis: { tickfont: { size: 9 }, gridcolor: '#1f2937' },
            yaxis: { gridcolor: '#1f2937' }
        }, { responsive: true, displayModeBar: false });
    }

    exportCsvBtn.addEventListener('click', () => {
        const filtered = hotspotDataset.filter(pt => {
            const regionMatch = (aoiSelect.value === 'ALL' || pt.region === aoiSelect.value);
            const confMatch = pt.confidence >= parseFloat(confSlider.value);
            let sensorMatch = true;
            if (sensorSelect.value === 'MODIS') sensorMatch = pt.sensor.toUpperCase().includes('MODIS');
            else if (sensorSelect.value === 'VIIRS') sensorMatch = pt.sensor.toUpperCase().includes('VIIRS');
            return regionMatch && confMatch && sensorMatch;
        });
        const headers = ['Latitude', 'Longitude', 'FRP_MW', 'Confidence_Pct', 'Sensor_Type', 'Region'];
        const rows = filtered.map(r => [r.lat, r.lon, r.frp, r.confidence, `"${r.sensor}"`, `"${r.region}"`].join(','));
        const blob = new Blob([[headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `quantticks_nasa_hotspots_${sensorSelect.value.toLowerCase()}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    });

    aoiSelect.addEventListener('change', renderDashboard);
    sensorSelect.addEventListener('change', renderDashboard);
    confSlider.addEventListener('input', renderDashboard);
    renderDashboard();
</script>

</body>
</html>

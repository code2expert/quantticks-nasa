<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantticks Oracle | Global Wildfire Telemetry & BI Command Center</title>
    <!-- Include Plotly.js for Zero-Bloat Interactive Browser Visualizations -->
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-green);
            letter-spacing: 0.05em;
        }
        .status-badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .chart-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">QUANTTICKS ORACLE // NASA FIRE PHYSICS</div>
        <div class="status-badge">● Sovereign Data Lake: Active (ZSTD)</div>
    </header>

    <!-- Top Summary Metrics Grid -->
    <div class="grid">
        <div class="card">
            <div class="card-title">Total Active Events Audited</div>
            <div class="metric-value" id="metric-events">814</div>
        </div>
        <div class="card">
            <div class="card-title">Parquet Compression Ratio</div>
            <div class="metric-value" style="color: var(--accent-green);">~80.5%</div>
        </div>
        <div class="card">
            <div class="card-title">Harmonized Sensors</div>
            <div class="metric-value" style="color: var(--accent-purple);">MODIS & VIIRS</div>
        </div>
    </div>

    <!-- Main Visualizations -->
    <div class="grid">
        <div class="chart-container">
            <div id="global-map" style="width:100%; height:400px;"></div>
        </div>
        <div class="chart-container">
            <div id="sensor-breakdown" style="width:100%; height:400px;"></div>
        </div>
    </div>

    <script>
        // Plotly Dashboard Configuration (Dark Theme)
        const darkLayout = {
            paper_bgcolor: '#111827',
            plot_bgcolor: '#111827',
            font: { color: '#f3f4f6' },
            margin: { t: 40, r: 20, b: 40, l: 40 }
        };

        // 1. Global Fire Scatter Map (Mock telemetry visualization across AOIs)
        const mapData = [{
            type: 'scattergeo',
            mode: 'markers',
            lat: [47.5, 36.7, 55.0, -3.0, 40.0, -35.0],
            lon: [-53.0, -119.4, 100.0, -60.0, 15.0, 145.0],
            text: ['Newfoundland AOI', 'California AOI', 'Siberia Taiga', 'Amazon Basin', 'Mediterranean', 'SE Australia'],
            marker: {
                size: [12, 18, 15, 20, 14, 16],
                color: [80, 95, 70, 100, 60, 85],
                colorscale: 'YlOrRd',
                showscale: true,
                colorbar: { title: 'Confidence / FRP' }
            }
        }];

        const mapLayout = {
            ...darkLayout,
            title: 'Global Active Fire Telemetry & AOI Hotspots',
            geo: {
                scope: 'world',
                bgcolor: '#111827',
                showland: true,
                landcolor: '#1f2937',
                subunitcolor: '#374151',
                countrycolor: '#374151',
                showocean: true,
                oceancolor: '#0b0f19'
            }
        };

        Plotly.newPlot('global-map', mapData, mapLayout, {responsive: true});

        // 2. Sensor & Radiative Power Breakdown Bar Chart
        const barData = [{
            x: ['MODIS (1km)', 'VIIRS SNPP (375m)', 'VIIRS NOAA-20 (375m)'],
            y: [120, 410, 284],
            type: 'bar',
            marker: { color: ['#10b981', '#8b5cf6', '#3b82f6'] }
        }];

        const barLayout = {
            ...darkLayout,
            title: 'Events Captured by Sensor Architecture',
            xaxis: { title: 'Sensor Type' },
            yaxis: { title: 'Harmonized Event Count' }
        };

        Plotly.newPlot('sensor-breakdown', barData, barLayout, {responsive: true});
    </script>

</body>
</html>

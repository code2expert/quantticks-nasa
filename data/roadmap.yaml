project: "Quantticks Oracle // NASA Space Apps Master Completed Roadmap"
maintained_by: "Quantticks Architecture & The Oracle Brain Layer Taxonomy"

phases:
  - phase: 1
    title: "Data Ingestion & Harmonization Engine"
    items:
      - id: "p1-1"
        name: "Multi-Sensor Extraction"
        description: "Automated REST ingestion for MODIS (1km) and VIIRS (375m) active fire telemetry feeds."
        status: "completed"
      - id: "p1-2"
        name: "Schema Harmonization"
        description: "Unified column mappings (brightness, bright_ti4, FRP, confidence scores) so sensor origin is fully abstracted."
        status: "completed"
      - id: "p1-3"
        name: "Global AOI Expansion"
        description: "Configured and tested across California, Alberta, Amazon Basin, Mediterranean, Southeast Australia, Siberia, Indonesia, and Newfoundland."
        status: "completed"
      - id: "p1-4"
        name: "ZSTD-Compressed Parquet Storage"
        description: "High-performance, zero-bloat local disk storage backed by DuckDB and audit event ledgers."
        status: "completed"

  - phase: 2
    title: "Monitoring & Real-Time Ingestion Server"
    items:
      - id: "p2-1"
        name: "Cloudflare R2 Telemetry Streaming Pipeline"
        description: "Python scripts and DuckDB connectors streaming normalized active fire telemetry directly to R2 parquet storage."
        status: "completed"

  - phase: 3
    title: "Presentation Layer & Markdown Web Publishing"
    items:
      - id: "p3-1"
        name: "Hugo Command Center Shell"
        description: "Zero-bloat static layout with Plotly.js dark-mode telemetry maps, sensor distribution charts, and MODIS/VIIRS filters."
        status: "completed"
      - id: "p3-2"
        name: "Granular Judge-Requested Sensor Separation"
        description: "Added dedicated sensor platform filtering and isolated breakdown charts for MODIS Only, VIIRS Only, and Combined views."
        status: "completed"
      - id: "p3-4"
        name: "Interactive Region & CSV Filter"
        description: "Browser-based AOI selector / lat-long coordinate filter with instant CSV export capabilities."
        status: "completed"

  - phase: 4
    title: "Production Deployment & Domain Infrastructure"
    items:
      - id: "p4-1"
        name: "Subdomain Configuration"
        description: "Dedicated subdomain (nasa.quantticks.com) hosting the live telemetry showcase."
        status: "completed"
      - id: "p4-2"
        name: "GitHub Repository Setup"
        description: "Structured repository housing ingestion scripts, configuration ledgers, and Hugo templates."
        status: "completed"
      - id: "p4-3"
        name: "GitHub Actions CI/CD Pipeline"
        description: "Automated workflow (.github/workflows/deploy.yml) executing static site compilation and zero-downtime publishing to Cloudflare Pages."
        status: "completed"
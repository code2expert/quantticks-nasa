project: "Quantticks Oracle // NASA Space Apps & Enterprise Master Checklist"
maintained_by: "Quantticks Architecture & The Oracle Brain Layer Taxonomy"

phases:
  - phase: 1
    title: "Data Ingestion & Harmonization Engine"
    items:
      - id: "p1-1"
        name: "Multi-Sensor Extraction"
        description: "Automated REST ingestion for MODIS (1km) and VIIRS (375m) active fire telemetry feeds."
        status: "completed"
      - id: "p1-2"
        name: "Schema Harmonization"
        description: "Unified column mappings (brightness, bright_ti4, FRP, confidence scores) so sensor origin is fully abstracted."
        status: "completed"
      - id: "p1-3"
        name: "Global AOI Expansion"
        description: "Configured and tested across California, Alberta, Amazon Basin, Mediterranean, Southeast Australia, Siberia, Indonesia, and Newfoundland."
        status: "completed"
      - id: "p1-4"
        name: "ZSTD-Compressed Parquet Storage"
        description: "High-performance, zero-bloat local disk storage (D:/nasa/parquet/) backed by DuckDB and audit event ledgers."
        status: "completed"

  - phase: 2
    title: "Monitoring & Real-Time Ingestion Server"
    items:
      - id: "p2-1"
        name: "Daemon / Cron Ingestion Service"
        description: "Background daemon script (77-chronicle-layer/monitor_ingest.py) polling NASA FIRMS for freshly published telemetry cycles."
        status: "pending"
      - id: "p2-2"
        name: "Deterministic Input Validation"
        description: "Strict regex and type-bounding on all API query parameters, bounding boxes, and date ranges to eliminate attack surfaces (SQLi, path traversal, injection vectors)."
        status: "pending"
      - id: "p2-3"
        name: "Automated State Tracking"
        description: "Persistent ledger recording sync timestamps, newly ingested event counts, and delta verification hashes."
        status: "pending"

  - phase: 3
    title: "Presentation Layer & Markdown Web Publishing"
    items:
      - id: "p3-1"
        name: "Hugo Command Center Shell"
        description: "Zero-bloat static layout with Plotly.js dark-mode telemetry maps and sensor distribution charts."
        status: "completed"
      - id: "p3-2"
        name: "Markdown-Driven Web Pages"
        description: "Utilize Hugo Markdown (content/*.md) front-matter and custom layouts to deploy all auxiliary web pages (Documentation, Architecture Specs, Team Bio)."
        status: "pending"
      - id: "p3-3"
        name: "Burning Activity Calendar"
        description: "Historical time-series visualization mapping hotspot frequencies from the 2000s to present against multi-year averages."
        status: "pending"
      - id: "p3-4"
        name: "Interactive Region & CSV Filter"
        description: "Browser-based AOI selector / lat-long coordinate filter with instant CSV export capabilities."
        status: "pending"

  - phase: 4
    title: "Production Deployment & Domain Infrastructure"
    items:
      - id: "p4-1"
        name: "Subdomain Configuration"
        description: "Dedicated subdomain (nasa.quantticks.com) hosting the live telemetry showcase."
        status: "completed"
      - id: "p4-2"
        name: "GitHub Repository Setup"
        description: "Structured repository housing ingestion scripts, configuration ledgers, and Hugo templates."
        status: "completed"
      - id: "p4-3"
        name: "GitHub Actions CI/CD Pipeline"
        description: "Automated workflow (.github/workflows/deploy.yml) executing static site compilation and zero-downtime publishing to Cloudflare Pages."
        status: "completed"